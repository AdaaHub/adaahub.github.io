<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>اتصل بنا | AdaaHub</title>

  <meta name="description" content="تواصل مع فريق AdaaHub لإرسال الاستفسارات والملاحظات والاقتراحات.">
  <meta name="robots" content="index, follow">

  <meta property="og:title" content="اتصل بنا | AdaaHub">
  <meta property="og:description" content="تواصل مع فريق AdaaHub لإرسال الاستفسارات والملاحظات والاقتراحات.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://adaahub.github.io/page/contact.html">

  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --primary-soft: rgba(37, 99, 235, 0.08);
      --bg: #f5f7fb;
      --surface: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.8;
    }

    a {
      color: inherit;
    }

    .header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 16px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      text-decoration: none;
      color: #111827;
      font-size: 24px;
      font-weight: bold;
    }

    .logo span {
      color: var(--primary);
    }

    .nav {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    .nav a {
      text-decoration: none;
      color: #374151;
      font-size: 15px;
      transition: color 0.2s ease;
    }

    .nav a:hover,
    .nav a:focus-visible {
      color: var(--primary);
    }

    .container {
      width: 92%;
      max-width: 850px;
      margin: 50px auto;
    }

    .contact-box {
      background: var(--surface);
      border-radius: 18px;
      padding: 35px;
      box-shadow: var(--shadow);
      border: 1px solid #e5e7eb;
    }

    .contact-title {
      text-align: center;
      margin-bottom: 10px;
      font-size: 30px;
      color: #111827;
    }

    .contact-intro {
      text-align: center;
      color: var(--muted);
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #374151;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
      outline: none;
      background: #fff;
      color: #111827;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus,
    textarea:focus,
    button:focus-visible,
    a:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    input:focus,
    textarea:focus {
      border-color: var(--primary);
    }

    textarea {
      min-height: 160px;
      resize: vertical;
    }

    .submit-btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      background: var(--primary);
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .submit-btn:hover {
      background: var(--primary-dark);
    }

    .submit-btn:disabled {
      opacity: 0.8;
      cursor: wait;
    }

    .form-status {
      min-height: 24px;
      margin-top: 12px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .form-status.success {
      color: #15803d;
      font-weight: bold;
    }

    .form-status.error {
      color: #b91c1c;
      font-weight: bold;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .note {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-top: 18px;
    }

    .footer {
      text-align: center;
      padding: 30px 20px;
      color: var(--muted);
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .header-inner {
        flex-direction: column;
      }

      .nav {
        justify-content: center;
      }

      .container {
        width: 94%;
        margin: 30px auto;
      }

      .contact-box {
        padding: 24px 18px;
      }

      .contact-title {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="header-inner">

    <a class="logo" href="../index.html" aria-label="العودة إلى الصفحة الرئيسية">
      Adaa<span>Hub</span>
    </a>

    <nav class="nav" aria-label="المتصفح الرئيسي">
      <a href="../index.html">الرئيسية</a>
      <a href="../index.html#tools">الأدوات</a>
      <a href="about.html">من نحن</a>
      <a href="privacy.html">الخصوصية</a>
    </nav>

  </div>
</header>

<main class="container">
  <section class="contact-box" aria-labelledby="contactTitle">
    <h1 id="contactTitle" class="contact-title">اتصل بنا</h1>

    <p class="contact-intro">
      لديك سؤال أو اقتراح أو واجهت مشكلة في إحدى أدوات AdaaHub؟
      أرسل لنا رسالتك وسنحاول مساعدتك.
    </p>

    <form id="contactForm" action="https://formspree.io/f/xaenwgbw" method="POST" novalidate>
      <div class="form-group">
        <label for="name">الاسم</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="اكتب اسمك"
          autocomplete="name"
          required
          maxlength="100"
        >
      </div>

      <div class="form-group">
        <label for="email">البريد الإلكتروني</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="example@email.com"
          autocomplete="email"
          required
          inputmode="email"
          maxlength="120"
        >
      </div>

      <div class="form-group">
        <label for="subject">الموضوع</label>
        <input
          type="text"
          id="subject"
          name="subject"
          placeholder="موضوع الرسالة"
          required
          maxlength="160"
        >
      </div>

      <div class="form-group">
        <label for="message">رسالتك</label>
        <textarea
          id="message"
          name="message"
          placeholder="اكتب رسالتك هنا..."
          required
          minlength="10"
          maxlength="1000"
        ></textarea>
      </div>

      <input type="text" name="_gotcha" class="sr-only" tabindex="-1" autocomplete="off">

      <button class="submit-btn" type="submit" id="submitBtn">
        إرسال الرسالة
      </button>

      <p id="formStatus" class="form-status" aria-live="polite"></p>
    </form>

    <p class="note">
      نستخدم بيانات الرسالة فقط للتعامل مع طلبك والتواصل معك عند الحاجة.
    </p>

  </section>
</main>

<footer class="footer">
  © 2026 AdaaHub — جميع الحقوق محفوظة
</footer>

<script>
  const form = document.getElementById("contactForm");
  const submitBtn = document.getElementById("submitBtn");
  const statusBox = document.getElementById("formStatus");

  form.addEventListener("submit", function (event) {
    const honeypot = form.querySelector('input[name="_gotcha"]');
    if (honeypot && honeypot.value.trim() !== "") {
      event.preventDefault();
      return;
    }

    const formData = new FormData(form);
    const fields = ["name", "email", "subject", "message"];

    let valid = true;

    for (const field of fields) {
      const input = form.elements[field];
      if (!input || !input.value.trim()) {
        valid = false;
        break;
      }
    }

    if (!valid) {
      event.preventDefault();
      statusBox.textContent = "يرجى ملء جميع الحقول المطلوبة.";
      statusBox.className = "form-status error";
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "جارٍ الإرسال...";
    statusBox.textContent = "يرجى الانتظار...";
    statusBox.className = "form-status";

    setTimeout(() => {
      statusBox.textContent = "تم إرسال رسالتك بنجاح. شكرًا لك!";
      statusBox.className = "form-status success";
      submitBtn.disabled = false;
      submitBtn.textContent = "إرسال الرسالة";
    }, 1200);
  });
</script>

</body>
</html>
