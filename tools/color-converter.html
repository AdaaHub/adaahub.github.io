<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Color Converter | AdaaHub</title>
  <meta name="description" content="تحويل الألوان بين HEX و RGB و HSL." />
  <style>
    :root{--primary:#2563eb;--bg:#f6f8fc;--surface:#fff;--text:#111827;--muted:#64748b;--border:#e5e7eb;--shadow:0 16px 45px rgba(15,23,42,.09)}
    *{box-sizing:border-box} body{margin:0;font-family:Arial,Tahoma,sans-serif;background:var(--bg);color:var(--text);line-height:1.8} a{text-decoration:none;color:inherit} button,input{font:inherit}
    .topbar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
    .wrap{max-width:1100px;margin:0 auto;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:24px}.brand-mark{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--primary),#4f46e5);display:grid;place-items:center;color:#fff}.nav{display:flex;gap:8px;align-items:center}.nav a,.theme-btn{padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;color:#334155;cursor:pointer}.nav a:hover,.theme-btn:hover{border-color:#bfdbfe;background:#eff6ff;color:var(--primary)}
    .container{max-width:1100px;margin:0 auto;padding:32px 18px 60px}.hero{text-align:center;margin-bottom:24px}.badge{display:inline-block;padding:8px 14px;border-radius:999px;background:#eff6ff;color:var(--primary);border:1px solid #dbeafe;font-weight:700}.hero h1{font-size:clamp(28px,4vw,42px);margin:16px 0 8px}.subtitle{max-width:700px;margin:0 auto;color:var(--muted)}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{display:flex;flex-direction:column;gap:8px}.field input{padding:12px 14px;border:1px solid var(--border);border-radius:12px}.sample{margin-top:18px;height:90px;border-radius:14px;border:1px solid var(--border)}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.btn{padding:12px 18px;border:none;border-radius:10px;cursor:pointer;font-weight:700}.primary{background:var(--primary);color:#fff}.secondary{background:#f8fafc;color:#334155;border:1px solid var(--border)}
    @media (max-width:700px){ .grid{grid-template-columns:1fr}.wrap{flex-wrap:wrap}.nav{width:100%;justify-content:flex-end}.actions{flex-direction:column}.btn{width:100%} }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="../index.html"><span class="brand-mark">A</span><span>Adaa<span style="color:var(--primary)">Hub</span></span></a>
      <nav class="nav">
        <a href="../index.html">الرئيسية</a>
        <button class="theme-btn" type="button" id="themeBtn">🌙</button>
      </nav>
    </div>
  </header>
  <main class="container">
    <section class="hero">
      <div class="badge">🎨 أداة مجانية</div>
      <h1>Color Converter</h1>
      <p class="subtitle">حول الألوان بين HEX و RGB و HSL مباشرة داخل المتصفح.</p>
    </section>
    <section class="card">
      <div class="grid">
        <div class="field"><label>HEX</label><input id="hex" value="#2563eb" /></div>
        <div class="field"><label>RGB</label><input id="rgb" value="37,99,235" /></div>
        <div class="field"><label>HSL</label><input id="hsl" value="217,91%,54%" /></div>
      </div>
      <div class="sample" id="sample"></div>
      <div class="actions">
        <button class="btn primary" id="convertBtn" type="button">تحويل</button>
      </div>
    </section>
  </main>
  <script>
    const hexInput = document.getElementById('hex');
    const rgbInput = document.getElementById('rgb');
    const hslInput = document.getElementById('hsl');
    const sample = document.getElementById('sample');
    function hexToRgb(hex){ const clean = hex.replace('#',''); const full = clean.length===3 ? clean.split('').map(ch=> ch+ch).join('') : clean; const num = parseInt(full,16); return {r:(num>>16)&255, g:(num>>8)&255, b:num&255}; }
    function rgbToHex(r,g,b){ return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('').toUpperCase(); }
    function rgbToHsl(r,g,b){ r/=255; g/=255; b/=255; const max=Math.max(r,g,b), min=Math.min(r,g,b); let h,s,l=(max+min)/2; if(max===min){h=s=0;} else { const d=max-min; s=l>0.5 ? d/(2-max-min) : d/(max+min); switch(max){ case r:h=(g-b)/d + (g < b ? 6:0); break; case g:h=(b-r)/d + 2; break; case b:h=(r-g)/d + 4; break;} h/=6; } return {h:Math.round(h*360), s:Math.round(s*100), l:Math.round(l*100)}; }
    function hslToRgb(h,s,l){ const sat=s/100, light=l/100; const c=(1-Math.abs(2*light-1))*sat; const x=c*(1-Math.abs((h/60)%2-1)); const m=light-c/2; let r=0,g=0,b=0; if (h>=0&&h<60){r=c;g=x;b=0;} else if (h>=60&&h<120){r=x;g=c;b=0;} else if (h>=120&&h<180){r=0;g=c;b=x;} else if (h>=180&&h<240){r=0;g=x;b=c;} else if (h>=240&&h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;} return {r:Math.round((r+m)*255), g:Math.round((g+m)*255), b:Math.round((b+m)*255)}; }
    function sync(){
      const hex = hexInput.value.trim();
      const rgb = rgbInput.value.trim();
      const hsl = hslInput.value.trim();
      let rgbObj = null, hslObj = null;
      if (/^#?[0-9A-Fa-f]{3,6}$/.test(hex)) { rgbObj = hexToRgb(hex); }
      if (/^\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}$/.test(rgb)) { const parts = rgb.split(',').map(v=>Number(v.trim())); if (parts.length===3 && parts.every(v => v>=0 && v<=255)) rgbObj = {r:parts[0],g:parts[1],b:parts[2]}; }
      if (/^\d{1,3}\s*,\s*\d{1,3}%?\s*,\s*\d{1,3}%?$/.test(hsl)) { const parts = hsl.split(',').map(v => v.trim().replace('%','')); if(parts.length===3){ const h = Number(parts[0]); const s = Number(parts[1]); const l = Number(parts[2]); if([h,s,l].every(v=>!Number.isNaN(v))) { const rgbVal = hslToRgb(h, s, l); rgbObj = rgbVal; } } }
      if (!rgbObj) return;
      const hexVal = rgbToHex(rgbObj.r, rgbObj.g, rgbObj.b);
      const hslVal = rgbToHsl(rgbObj.r, rgbObj.g, rgbObj.b);
      hexInput.value = hexVal;
      rgbInput.value = `${rgbObj.r},${rgbObj.g},${rgbObj.b}`;
      hslInput.value = `${hslVal.h},${hslVal.s}%,${hslVal.l}%`;
      sample.style.background = hexVal;
    }
    document.getElementById('convertBtn').addEventListener('click', sync);
    hexInput.addEventListener('input', sync);
    rgbInput.addEventListener('input', sync);
    hslInput.addEventListener('input', sync);
    sync();
    const savedTheme = localStorage.getItem('adaahub-theme');
    if (savedTheme === 'dark') document.documentElement.style.filter = 'invert(0.06) hue-rotate(180deg)';
    document.getElementById('themeBtn').addEventListener('click', () => {
      const isDark = document.documentElement.style.filter;
      if (isDark) { document.documentElement.style.filter = ''; localStorage.setItem('adaahub-theme','light'); }
      else { document.documentElement.style.filter = 'invert(0.06) hue-rotate(180deg)'; localStorage.setItem('adaahub-theme','dark'); }
    });
  </script>
</body>
</html>
