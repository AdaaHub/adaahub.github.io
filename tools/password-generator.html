<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Generator | AdaaHub</title>
  <meta name="description" content="مولد كلمات مرور متقدم يدعم الأحرف والرموز والأرقام." />
  <style>
    :root{--primary:#2563eb;--bg:#f6f8fc;--surface:#fff;--text:#111827;--muted:#64748b;--border:#e5e7eb;--shadow:0 16px 45px rgba(15,23,42,.09)}
    *{box-sizing:border-box} body{margin:0;font-family:Arial,Tahoma,sans-serif;background:var(--bg);color:var(--text);line-height:1.8} a{text-decoration:none;color:inherit} button,input{font:inherit}
    .topbar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
    .wrap{max-width:1100px;margin:0 auto;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:24px}.brand-mark{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--primary),#4f46e5);display:grid;place-items:center;color:#fff}.nav{display:flex;gap:8px;align-items:center}.nav a,.theme-btn{padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;color:#334155;cursor:pointer}.nav a:hover,.theme-btn:hover{border-color:#bfdbfe;background:#eff6ff;color:var(--primary)}
    .container{max-width:1100px;margin:0 auto;padding:32px 18px 60px}.hero{text-align:center;margin-bottom:24px}.badge{display:inline-block;padding:8px 14px;border-radius:999px;background:#eff6ff;color:var(--primary);border:1px solid #dbeafe;font-weight:700}.hero h1{font-size:clamp(28px,4vw,42px);margin:16px 0 8px}.subtitle{max-width:700px;margin:0 auto;color:var(--muted)}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
    .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.label{font-weight:700}.range-wrap{display:flex;align-items:center;gap:12px;flex:1}.input{flex:1;padding:12px 14px;border:1px solid var(--border);border-radius:12px}.output{margin-top:16px;padding:18px;border-radius:14px;border:1px solid var(--border);background:#f8fafc;font-weight:800;font-size:18px;word-break:break-all}
    .checks{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}.check{display:flex;align-items:center;gap:8px}.check input{accent-color:var(--primary)}
    .actions{display:flex;flex-wrap:wrap;gap:10px}.btn{padding:12px 18px;border:none;border-radius:10px;cursor:pointer;font-weight:700}.primary{background:var(--primary);color:#fff}.secondary{background:#f8fafc;color:#334155;border:1px solid var(--border)}
    @media (max-width:700px){ .wrap{flex-wrap:wrap}.nav{width:100%;justify-content:flex-end}.actions{flex-direction:column}.btn{width:100%}.row{flex-direction:column;align-items:stretch} }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="../index.html"><span class="brand-mark">A</span><span>Adaa<span style="color:var(--primary)">Hub</span></span></a>
      <nav class="nav">
        <a href="../index.html">الرئيسية</a>
        <button class="theme-btn" type="button" id="themeBtn">🌙</button>
      </nav>
    </div>
  </header>
  <main class="container">
    <section class="hero">
      <div class="badge">🔐 أداة مجانية</div>
      <h1>Password Generator</h1>
      <p class="subtitle">أنشئ كلمات مرور قوية بأمان عالي دون إرسالها إلى أي خادم.</p>
    </section>
    <section class="card">
      <div class="row">
        <label class="label" for="length">الطول</label>
        <div class="range-wrap">
          <input id="length" class="input" type="range" min="8" max="64" value="16" />
          <strong id="lengthValue">16</strong>
        </div>
      </div>
      <div class="checks">
        <label class="check"><input id="upper" type="checkbox" checked /> أحرف كبيرة</label>
        <label class="check"><input id="lower" type="checkbox" checked /> أحرف صغيرة</label>
        <label class="check"><input id="numbers" type="checkbox" checked /> أرقام</label>
        <label class="check"><input id="symbols" type="checkbox" /> رموز</label>
      </div>
      <div class="actions">
        <button class="btn primary" id="genBtn" type="button">توليد</button>
        <button class="btn secondary" id="copyBtn" type="button">نسخ</button>
      </div>
      <div class="output" id="passwordOutput">AdaaHub-2026</div>
    </section>
  </main>
  <script>
    const lengthInput = document.getElementById('length');
    const lengthValue = document.getElementById('lengthValue');
    const passwordOutput = document.getElementById('passwordOutput');
    lengthInput.addEventListener('input', () => lengthValue.textContent = lengthInput.value);
    function rand(max){ return Math.floor(Math.random() * max); }
    function makePassword(){
      const upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const lower = 'abcdefghijklmnopqrstuvwxyz';
      const numbers = '0123456789';
      const symbols = '!@#$%^&*()_+-=[]{}|;:,.<>?';
      const chars = [];
      if (document.getElementById('upper').checked) chars.push(...upper);
      if (document.getElementById('lower').checked) chars.push(...lower);
      if (document.getElementById('numbers').checked) chars.push(...numbers);
      if (document.getElementById('symbols').checked) chars.push(...symbols);
      if (!chars.length) { return 'اختر نوع واحد على الأقل'; }
      let password = '';
      for (let i = 0; i < Number(lengthInput.value); i++) password += chars[rand(chars.length)];
      return password;
    }
    document.getElementById('genBtn').addEventListener('click', () => passwordOutput.textContent = makePassword());
    document.getElementById('copyBtn').addEventListener('click', async () => {
      await navigator.clipboard.writeText(passwordOutput.textContent);
      document.getElementById('copyBtn').textContent = 'تم النسخ';
      setTimeout(() => document.getElementById('copyBtn').textContent = 'نسخ', 1000);
    });
    const savedTheme = localStorage.getItem('adaahub-theme');
    if (savedTheme === 'dark') document.documentElement.style.filter = 'invert(0.06) hue-rotate(180deg)';
    document.getElementById('themeBtn').addEventListener('click', () => {
      const isDark = document.documentElement.style.filter;
      if (isDark) { document.documentElement.style.filter = ''; localStorage.setItem('adaahub-theme','light'); }
      else { document.documentElement.style.filter = 'invert(0.06) hue-rotate(180deg)'; localStorage.setItem('adaahub-theme','dark'); }
    });
  </script>
</body>
</html>
