<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الصفحة غير موجودة | AdaaHub</title>
  <meta name="description" content="الصفحة التي تبحث عنها غير موجودة أو تم نقلها. يمكنك العودة إلى الرئيسية أو استعراض أدوات AdaaHub." />
  <style>
    :root{
      --primary:#2563eb;
      --primary-dark:#1d4ed8;
      --primary-soft:#eff6ff;
      --bg:#f6f8fc;
      --surface:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --border:#e5e7eb;
      --shadow:0 18px 50px rgba(15,23,42,.08);
    }

    @media (prefers-color-scheme: dark) {
      :root{
        --primary:#60a5fa;
        --primary-dark:#93c5fd;
        --primary-soft:#172554;
        --bg:#0b1120;
        --surface:#111827;
        --text:#e2e8f0;
        --muted:#94a3b8;
        --border:#243044;
      }
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial, Tahoma, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(37,99,235,.12), transparent 28%),
        var(--bg);
      color:var(--text);
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
    }

    .card{
      width:min(900px, 100%);
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:24px;
      box-shadow:var(--shadow);
      overflow:hidden;
      border-top:4px solid var(--primary);
    }

    .inner{
      padding:48px 28px 36px;
      text-align:center;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      background:var(--primary-soft);
      color:var(--primary);
      border:1px solid rgba(37,99,235,.15);
      border-radius:999px;
      padding:8px 14px;
      font-size:13px;
      font-weight:700;
      margin-bottom:18px;
    }

    .code{
      font-size:clamp(52px, 10vw, 120px);
      font-weight:900;
      line-height:1;
      letter-spacing:-0.06em;
      margin:0;
      color:var(--primary);
    }

    h1{
      margin:12px 0 12px;
      font-size:clamp(28px, 4vw, 42px);
      line-height:1.3;
      color:var(--text);
    }

    p{
      margin:0 auto;
      max-width:560px;
      color:var(--muted);
      font-size:17px;
      line-height:1.9;
    }

    .actions{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:12px;
      margin-top:28px;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      padding:14px 22px;
      border-radius:12px;
      font-weight:700;
      transition:.2s ease;
      min-width:170px;
    }

    .btn.primary{
      background:linear-gradient(135deg, var(--primary), var(--primary-dark));
      color:#fff;
      box-shadow:0 12px 28px rgba(37,99,235,.22);
    }

    .btn.primary:hover{
      transform:translateY(-2px);
    }

    .btn.secondary{
      background:var(--surface);
      border:1px solid var(--border);
      color:var(--text);
    }

    .btn.secondary:hover{
      background:var(--primary-soft);
      border-color:rgba(37,99,235,.2);
    }

    .quick-links{
      margin-top:28px;
      padding-top:22px;
      border-top:1px solid var(--border);
      text-align:right;
    }

    .quick-links h2{
      margin:0 0 14px;
      font-size:18px;
      color:var(--text);
    }

    .links{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:10px;
    }

    .links a{
      text-decoration:none;
      color:var(--primary);
      background:var(--primary-soft);
      border:1px solid rgba(37,99,235,.12);
      border-radius:10px;
      padding:8px 12px;
      font-size:14px;
      font-weight:700;
    }

    .links a:hover{
      border-color:var(--primary);
    }

    @media (max-width: 600px){
      .inner{
        padding:28px 18px 24px;
      }

      .actions{
        flex-direction:column;
      }

      .btn{
        width:100%;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="inner">
      <div class="badge">⚠️ خطأ 404</div>
      <div class="code">404</div>
      <h1>الصفحة غير موجودة</h1>
      <p>
        عذراً، الصفحة التي تحاول الوصول إليها غير موجودة أو ربما تم نقلها إلى عنوان آخر.
        يمكنك العودة إلى الصفحة الرئيسية أو استخدام أحد الأدوات الشائعة أدناه.
      </p>

      <div class="actions">
        <a class="btn primary" href="/index.html">العودة إلى الرئيسية</a>
        <a class="btn secondary" href="/tools/resize.html">استخدم أداة تغيير الحجم</a>
      </div>

      <div class="quick-links">
        <h2>أدوات شائعة</h2>
        <div class="links">
          <a href="/tools/compress.html">ضغط الصور</a>
          <a href="/tools/resize.html">تغيير الحجم</a>
          <a href="/tools/crop.html">قص الصور</a>
          <a href="/tools/ocr.html">OCR</a>
          <a href="/tools/pdf.html">PDF</a>
          <a href="/tools/word-counter.html">عداد الكلمات</a>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
